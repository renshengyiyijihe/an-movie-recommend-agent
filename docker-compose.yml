version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: noodledb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    environment:
      AUTH_HTTP_PORT: 3002
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/noodledb
      JWT_SECRET: ${JWT_SECRET:-changeme123}
      JWT_EXPIRES_IN: 7d
      AUTH_GRPC_BIND: 0.0.0.0:50051
    depends_on:
      - postgres
    restart: always

  noodle-service:
    build:
      context: ./backend
      dockerfile: noodle-service/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/noodle-service/.env
    environment:
      PORT: 3001
      AUTH_GRPC_ADDRESS: auth-service:50051
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      - auth-service
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - noodle-service
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  portainer_data:
