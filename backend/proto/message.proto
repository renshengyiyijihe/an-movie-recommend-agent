syntax = "proto3";

package message;

service Message {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc StartTurn(StartTurnRequest) returns (StartTurnResponse);
  rpc AppendTurnEvent(AppendTurnEventRequest) returns (AppendTurnEventResponse);
  rpc CompleteTurn(CompleteTurnRequest) returns (CompleteTurnResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc GetTurn(GetTurnRequest) returns (GetTurnResponse);
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
}

message CreateConversationRequest {
  string title = 1;
}

message CreateConversationResponse {
  string conversation_id = 1;
}

message StartTurnRequest {
  string conversation_id = 1;
  string user_content_json = 2;
}

message StartTurnResponse {
  string turn_id = 1;
  string user_message_id = 2;
}

message AppendTurnEventRequest {
  string turn_id = 1;
  string body_json = 2;
}

message AppendTurnEventResponse {
  string event_id = 1;
  int32 seq = 2;
}

message CompleteTurnRequest {
  string turn_id = 1;
  string status = 2;
  string assistant_payload_json = 3;
  // 本轮的一句话跨会话记忆，空串表示本轮不写向量库。不进可见气泡。
  string memory_text = 4;
}

message CompleteTurnResponse {
  string assistant_message_id = 1;
}

message ChatItem {
  string id = 1;
  string turn_id = 2;
  string role = 3;
  string kind = 4;
  string payload_json = 5;
  string created_at = 6;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  string conversation_id = 1;
  string user_id = 2;
  string title = 3;
  repeated ChatItem messages = 4;
}

message TurnEventRecord {
  string id = 1;
  int32 seq = 2;
  string body_json = 3;
  string created_at = 4;
}

message GetTurnRequest {
  string turn_id = 1;
}

message GetTurnResponse {
  string turn_id = 1;
  string conversation_id = 2;
  string status = 3;
  repeated ChatItem messages = 4;
  repeated TurnEventRecord events = 5;
}

message MemoryItem {
  string text = 1;
  string conversation_id = 2;
  float score = 3;
}

// 调用身份走 metadata user-id，请求体不带 user_id。
message SearchMemoriesRequest {
  string query = 1;
  string exclude_conversation_id = 2;
  int32 limit = 3;
}

message SearchMemoriesResponse {
  repeated MemoryItem memories = 1;
}
