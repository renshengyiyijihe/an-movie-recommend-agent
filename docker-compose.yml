services:
  # Build artifact only. Other images COPY --from=packages; this container exits immediately.
  # Use docker-image:// (not service:packages): older Compose/Bake treats
  # service:packages as a path under the project dir and fails the build.
  packages:
    image: an-movie-packages
    pull_policy: build
    build:
      context: .
      dockerfile: packages/Dockerfile
    command: ["true"]
    restart: "no"
    network_mode: none

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: anmovie_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
      additional_contexts:
        packages: docker-image://an-movie-packages
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    environment:
      AUTH_HTTP_PORT: 3002
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/anmovie_db
      JWT_EXPIRES_IN: 7d
      AUTH_GRPC_BIND: 0.0.0.0:50051
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: always

  movie-service:
    build:
      context: .
      dockerfile: backend/movie-service/Dockerfile
      additional_contexts:
        packages: docker-image://an-movie-packages
    ports:
      - "3001:3001"
    env_file:
      - ./backend/movie-service/.env
    environment:
      PORT: 3001
      AUTH_GRPC_ADDRESS: auth-service:50051
      MESSAGE_GRPC_ADDRESS: message-service:50052
    depends_on:
      auth-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: always

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - milvus_etcd:/etcd
    command: >
      etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    restart: always

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: always

  # milvus:
  #   image: milvusdb/milvus:latest
  #   command: ["milvus", "run", "standalone"]
  #   ports:
  #     - "19530:19530"
  #     - "9091:9091"
  #   environment:
  #     COMMON_STORAGETYPE: local
  #     COMMON_MEMORYTYPEREADABLETYPE: immutable
  #   volumes:
  #     - milvus_data:/var/lib/milvus
  #   restart: always

  message-service:
    build:
      context: .
      dockerfile: backend/message-service/Dockerfile
      additional_contexts:
        packages: docker-image://an-movie-packages
    ports:
      - "3003:3003"
      - "50052:50052"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3003
      MESSAGE_GRPC_PORT: 50052
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/anmovie_db
      AUTH_GRPC_ADDRESS: auth-service:50051
      MILVUS_URL: milvus:19530
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 25s
    restart: always

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      additional_contexts:
        packages: docker-image://an-movie-packages
      args:
        VITE_API_BASE_URL: /
    ports:
      - "80:80"
    depends_on:
      auth-service:
        condition: service_healthy
      movie-service:
        condition: service_healthy
      message-service:
        condition: service_healthy
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  milvus_data:
  milvus_etcd:
  milvus_minio:
  portainer_data:
