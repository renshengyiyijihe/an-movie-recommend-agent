name: Deploy to Aliyun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/package.json
            backend/pnpm-lock.yaml
            client/package.json
            client/pnpm-lock.yaml

      - name: Cache backend node_modules
        uses: actions/cache@v4
        id: backend-node-modules
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ runner.os }}-${{ hashFiles('backend/package.json', 'backend/pnpm-lock.yaml') }}

      - name: Cache client node_modules
        uses: actions/cache@v4
        id: client-node-modules
        with:
          path: client/node_modules
          key: client-node-modules-${{ runner.os }}-${{ hashFiles('client/package.json', 'client/pnpm-lock.yaml') }}

      - name: Install backend dependencies
        if: steps.backend-node-modules.outputs.cache-hit != 'true'
        working-directory: backend
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install client dependencies
        if: steps.client-node-modules.outputs.cache-hit != 'true'
        working-directory: client
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            REPO_URL="https://github.com/renshengyiyijihe/noodle-recommendation-agent.git"
            DEPLOY_DIR="/opt/noodle-app"

            mkdir -p /opt
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            else
              rm -rf "$DEPLOY_DIR"
              git clone "$REPO_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            cat > .env <<EOF
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            EOF

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            docker compose down || true
            docker compose up -d --build
