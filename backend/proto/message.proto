syntax = "proto3";

package message;

service Message {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc AppendMessage(AppendMessageRequest) returns (AppendMessageResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc SearchSimilarContext(SearchSimilarContextRequest) returns (SearchSimilarContextResponse);
}

message CreateConversationRequest {
  string user_id = 1;
  string title = 2;
}

message CreateConversationResponse {
  string conversation_id = 1;
}

message AppendMessageRequest {
  string conversation_id = 1;
  string role = 2;
  string message_type = 3;
  string stage = 4;
  optional string content = 5;
  optional string summary = 6;
  repeated string topics = 7;
  repeated string entities = 8;
  optional string user_message_id = 9;
}

message AppendMessageResponse {
  bool ok = 1;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  string conversation_id = 1;
  string user_id = 2;
  string title = 3;
  repeated MessageRecord messages = 4;
}

message MessageRecord {
  string id = 1;
  string role = 2;
  string message_type = 3;
  string stage = 4;
  string content = 5;
  string created_at = 6;
}

message RelatedContextItem {
  string role = 1;
  string content = 2;
  string message_type = 3;
  string stage = 4;
}

message SearchSimilarContextRequest {
  string user_input = 1;
  string conversation_id = 2;
  int32 limit = 3;
}

message SearchSimilarContextResponse {
  repeated RelatedContextItem context_items = 1;
}
