name: Deploy to Aliyun

on:
  push:
    branches:
      - main

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH and send notification
        id: deploy
        timeout-minutes: 60
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -u
            REPO_URL="https://github.com/renshengyiyijihe/an-movie-recommend-agent.git"
            DEPLOY_DIR="/opt/an-movie"
            LOG_FILE="/tmp/an-movie-deploy.log"
            SUMMARY_FILE="/tmp/an-movie-deploy-summary.txt"

            export GMAIL_USERNAME="${{ secrets.GMAIL_USERNAME }}"
            export GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}"
            export GMAIL_TO="${{ secrets.GMAIL_TO }}"
            export GITHUB_RUN_ID="${{ github.run_id }}"
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export GITHUB_WORKFLOW="${{ github.workflow }}"

            mkdir -p /opt
            : > "$LOG_FILE"
            exec > >(tee -a "$LOG_FILE") 2>&1

            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            else
              rm -rf "$DEPLOY_DIR"
              git clone "$REPO_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            COMMIT_TITLE="$(git log -1 --pretty=format:%s)"
            export COMMIT_TITLE

            mkdir -p backend/movie-service
            cat > backend/.env <<EOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            POSTGRES_URL=postgresql://postgres:password@postgres:5432/anmovie_db
            EOF

            cat > backend/movie-service/.env <<EOF
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            TMDB_API_URL=${{ secrets.TMDB_API_URL }}
            EOF

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            export COMPOSE_BAKE=true
            export COMPOSE_PROJECT_NAME="an-movie"

            set +e
            docker compose down --remove-orphans || true
            docker rm -f an-movie-postgres-1 an-movie-milvus-1 an-movie-auth-service-1 an-movie-message-service-1 an-movie-movie-service-1 an-movie-frontend-1 an-movie-portainer-1 portainer 2>/dev/null || true
            docker compose build packages && docker compose up -d --build --remove-orphans
            deploy_status=$?
            set -e

            echo "DEPLOY_EXIT_CODE=$deploy_status"
            tail -n 40 "$LOG_FILE" > "$SUMMARY_FILE"

            export DEPLOY_STATUS="$deploy_status"
            set +e
            python <<'PY'
            import os
            import smtplib
            from email.message import EmailMessage
            from pathlib import Path

            username = os.environ.get('GMAIL_USERNAME')
            password = os.environ.get('GMAIL_APP_PASSWORD')
            to_addr = os.environ.get('GMAIL_TO')
            deploy_status = int(os.environ['DEPLOY_STATUS'])
            status_text = 'SUCCESS' if deploy_status == 0 else 'FAILED'
            emoji = '✅' if deploy_status == 0 else '❌'
            summary = Path('/tmp/an-movie-deploy-summary.txt').read_text(encoding='utf-8', errors='replace').strip() or '无日志摘要'
            repo = 'renshengyiyijihe/an-movie-recommend-agent'
            run_url = f"https://github.com/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID', 'unknown')}"

            commit_title = os.environ.get('COMMIT_TITLE', 'unknown commit')
            subject = f"{emoji} [{status_text}] 部署通知 - {repo} - {commit_title}"
            body = f"""部署结果: {status_text}
            仓库: {repo}
            提交标题: {commit_title}
            详情: {run_url}

            日志摘要:
            {summary}
            """

            msg = EmailMessage()
            msg['From'] = username or 'noreply@example.com'
            msg['To'] = to_addr or 'unknown@example.com'
            msg['Subject'] = subject
            msg.set_content(body)

            try:
                if username and password and to_addr:
                    with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as smtp:
                        smtp.starttls()
                        smtp.login(username, password)
                        smtp.send_message(msg)
                    print(f"Notification email sent to {to_addr} with status {status_text}")
                else:
                    print("Skipping email notification because Gmail credentials or recipient address are not configured.")
            except Exception as exc:
                print(f"Warning: failed to send notification email: {exc}")

            PY
            set -e

            exit "$deploy_status"
