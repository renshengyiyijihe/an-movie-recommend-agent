global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:3002"]

  - job_name: movie-service
    metrics_path: /metrics
    static_configs:
      - targets: ["movie-service:3001"]

  - job_name: message-service
    metrics_path: /metrics
    static_configs:
      - targets: ["message-service:3003"]
