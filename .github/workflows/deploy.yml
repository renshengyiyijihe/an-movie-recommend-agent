name: Deploy to Aliyun

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/auth-service/package.json
            backend/auth-service/pnpm-lock.yaml
            backend/noodle-service/package.json
            backend/noodle-service/pnpm-lock.yaml
            client/package.json
            client/pnpm-lock.yaml

      - name: Cache auth-service node_modules
        uses: actions/cache@v4
        id: auth-node-modules
        with:
          path: backend/auth-service/node_modules
          key: auth-node-modules-${{ runner.os }}-${{ hashFiles('backend/auth-service/package.json', 'backend/auth-service/pnpm-lock.yaml') }}

      - name: Cache noodle-service node_modules
        uses: actions/cache@v4
        id: noodle-node-modules
        with:
          path: backend/noodle-service/node_modules
          key: noodle-node-modules-${{ runner.os }}-${{ hashFiles('backend/noodle-service/package.json', 'backend/noodle-service/pnpm-lock.yaml') }}

      - name: Cache client node_modules
        uses: actions/cache@v4
        id: client-node-modules
        with:
          path: client/node_modules
          key: client-node-modules-${{ runner.os }}-${{ hashFiles('client/package.json', 'client/pnpm-lock.yaml') }}

      - name: Install auth-service dependencies
        if: steps.auth-node-modules.outputs.cache-hit != 'true'
        working-directory: backend/auth-service
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install noodle-service dependencies
        if: steps.noodle-node-modules.outputs.cache-hit != 'true'
        working-directory: backend/noodle-service
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install client dependencies
        if: steps.client-node-modules.outputs.cache-hit != 'true'
        working-directory: client
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deploy via SSH and send notification
        id: deploy
        timeout-minutes: 60
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -u
            REPO_URL="https://github.com/renshengyiyijihe/noodle-recommendation-agent.git"
            DEPLOY_DIR="/opt/noodle-app"
            LOG_FILE="/tmp/noodle-deploy.log"
            SUMMARY_FILE="/tmp/noodle-deploy-summary.txt"

            export GMAIL_USERNAME="${{ secrets.GMAIL_USERNAME }}"
            export GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}"
            export GMAIL_TO="${{ secrets.GMAIL_TO }}"
            export GITHUB_RUN_ID="${{ github.run_id }}"
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export GITHUB_WORKFLOW="${{ github.workflow }}"

            mkdir -p /opt
            : > "$LOG_FILE"
            exec > >(tee -a "$LOG_FILE") 2>&1

            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git checkout main
              git reset --hard origin/main
            else
              rm -rf "$DEPLOY_DIR"
              git clone "$REPO_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            COMMIT_TITLE="$(git log -1 --pretty=format:%s)"
            export COMMIT_TITLE

            mkdir -p backend
            cat > backend/.env <<EOF
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            EOF

            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            export COMPOSE_PROJECT_NAME="noodle-app"

            set +e
            docker compose down --remove-orphans || true
            docker rm -f noodle-app-postgres-1 noodle-app-auth-service-1 noodle-app-noodle-service-1 noodle-app-frontend-1 noodle-app-portainer-1 2>/dev/null || true
            docker rm -f noodle-recommendation-agent-postgres-1 noodle-recommendation-agent-auth-service-1 noodle-recommendation-agent-noodle-service-1 noodle-recommendation-agent-frontend-1 noodle-recommendation-agent-portainer-1 2>/dev/null || true
            docker compose up -d --build --remove-orphans
            deploy_status=$?
            set -e

            echo "DEPLOY_EXIT_CODE=$deploy_status"
            tail -n 40 "$LOG_FILE" > "$SUMMARY_FILE"

            export DEPLOY_STATUS="$deploy_status"
            set +e
            python <<'PY'
            import os
            import smtplib
            from email.message import EmailMessage
            from pathlib import Path

            username = os.environ.get('GMAIL_USERNAME')
            password = os.environ.get('GMAIL_APP_PASSWORD')
            to_addr = os.environ.get('GMAIL_TO')
            deploy_status = int(os.environ['DEPLOY_STATUS'])
            status_text = 'SUCCESS' if deploy_status == 0 else 'FAILED'
            emoji = '✅' if deploy_status == 0 else '❌'
            summary = Path('/tmp/noodle-deploy-summary.txt').read_text(encoding='utf-8', errors='replace').strip() or '无日志摘要'
            repo = 'renshengyiyijihe/noodle-recommendation-agent'
            run_url = f"https://github.com/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID', 'unknown')}"

            commit_title = os.environ.get('COMMIT_TITLE', 'unknown commit')
            subject = f"{emoji} [{status_text}] 部署通知 - {repo} - {commit_title}"
            body = f"""部署结果: {status_text}
            仓库: {repo}
            提交标题: {commit_title}
            详情: {run_url}

            日志摘要:
            {summary}
            """

            msg = EmailMessage()
            msg['From'] = username or 'noreply@example.com'
            msg['To'] = to_addr or 'unknown@example.com'
            msg['Subject'] = subject
            msg.set_content(body)

            try:
                if username and password and to_addr:
                    with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as smtp:
                        smtp.starttls()
                        smtp.login(username, password)
                        smtp.send_message(msg)
                    print(f"Notification email sent to {to_addr} with status {status_text}")
                else:
                    print("Skipping email notification because Gmail credentials or recipient address are not configured.")
            except Exception as exc:
                print(f"Warning: failed to send notification email: {exc}")

            PY
            set -e

            exit "$deploy_status"
