version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: anmovie_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    environment:
      AUTH_HTTP_PORT: 3002
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/anmovie_db
      JWT_SECRET: ${JWT_SECRET:-changeme123}
      JWT_EXPIRES_IN: 7d
      AUTH_GRPC_BIND: 0.0.0.0:50051
    depends_on:
      - postgres
    restart: always

  movie-service:
    build:
      context: ./backend
      dockerfile: movie-service/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/movie-service/.env
    environment:
      PORT: 3001
      AUTH_GRPC_ADDRESS: auth-service:50051
      MESSAGE_GRPC_ADDRESS: message-service:50052
    depends_on:
      - auth-service
      - message-service
    restart: always

  milvus:
    image: milvusdb/milvus:latest
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      COMMON_STORAGETYPE: local
      COMMON_MEMORYTYPEREADABLETYPE: immutable
    volumes:
      - milvus_data:/var/lib/milvus
    restart: always

  message-service:
    build:
      context: ./backend
      dockerfile: message-service/Dockerfile
    ports:
      - "3003:3003"
      - "50052:50052"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3003
      MESSAGE_GRPC_PORT: 50052
      POSTGRES_URL: postgresql://postgres:password@postgres:5432/anmovie_db
      AUTH_GRPC_ADDRESS: auth-service:50051
      MILVUS_URL: milvus:19530
    depends_on:
      - postgres
      - auth-service
      - milvus
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - movie-service
      - message-service
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  milvus_data:
  portainer_data:
